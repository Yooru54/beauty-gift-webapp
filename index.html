<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beauty Gift Event</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #ffd5e8;
        font-family: "Montserrat", sans-serif;
        text-align: center;
        overflow-x: hidden;
    }

    .title-wrap {
        padding-top: 80px;
        padding-bottom: 40px;
        color: #c12f74;
    }

    .title-wrap h1 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .title-wrap p {
        font-size: 18px;
        opacity: 0.8;
    }

    .preview-box {
        width: 280px;
        height: 320px;
        background: #ffe8f3;
        margin: 0 auto;
        border-radius: 25px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: #c1377b;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .open-btn {
        margin-top: 35px;
        padding: 14px 40px;
        font-size: 20px;
        background: #c1377b;
        color: white;
        border: none;
        border-radius: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }
    .open-btn:active {
        transform: scale(0.97);
    }

    /* ------ MODAL ------ */
    .modal-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.65);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 15;
    }

    .modal {
        background: #fff;
        width: 90%;
        max-width: 400px;
        border-radius: 20px;
        padding: 25px 15px;
        position: relative;
        animation: modalIn 0.4s ease;
    }

    @keyframes modalIn {
        from { transform: scale(0.7); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .close-x {
        position: absolute;
        top: 12px;
        right: 15px;
        font-size: 26px;
        color: #c1377b;
        cursor: pointer;
        font-weight: 700;
    }

    /* ---- Roulette ---- */

    .wheel {
        width: 280px;
        height: 280px;
        border-radius: 50%;
        border: 8px solid #ff9ecb;
        overflow: hidden;
        position: relative;
        margin: 0 auto;
        transition: transform 4s cubic-bezier(.17,.67,.17,1);
    }

    .slice {
        position: absolute;
        width: 50%;
        height: 50%;
        transform-origin: 100% 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        color: #7a004a;
    }

    .slice:nth-child(1) { background:#ffd2e8; transform: rotate(0deg) skewY(-30deg); }
    .slice:nth-child(2) { background:#ffc4e0; transform: rotate(90deg) skewY(-30deg); }
    .slice:nth-child(3) { background:#ffb8dd; transform: rotate(180deg) skewY(-30deg); }
    .slice:nth-child(4) { background:#ffabd6; transform: rotate(270deg) skewY(-30deg); }

    .pointer {
        width: 0; height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-bottom: 30px solid #d82f87;
        margin: 0 auto;
        margin-top: 10px;
    }

    .spin-btn {
        margin-top: 20px;
        padding: 12px 30px;
        background: #d82f87;
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
    }

    .spin-btn:active {
        transform: scale(0.97);
    }

    /* Fireworks */
    .firework {
        position: fixed;
        width: 10px;
        height: 10px;
        background: gold;
        border-radius: 50%;
        animation: explode 1s ease-out forwards;
        pointer-events: none;
        z-index: 30;
    }

    @keyframes explode {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(5); opacity: 0; }
    }

    /* Popup */
    .win-popup {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 25px 25px;
        font-size: 18px;
        border-radius: 18px;
        color: #c1377b;
        text-align: center;
        box-shadow: 0 0 20px rgba(255,255,255,0.4);
        display: none;
        z-index: 20;
        animation: popupIn 0.5s ease;
    }

    @keyframes popupIn {
        from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
        to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

</style>
</head>

<body>

<div class="title-wrap">
    <h1>BEAUTY GIFT<br>COUPON EVENT</h1>
    <p>Получите шанс выиграть подарок</p>
</div>

<div class="preview-box">
    🎁 Try Your Luck!
</div>

<button class="open-btn" onclick="openModal()">GO</button>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
    <div class="modal">
        <div class="close-x" onclick="closeModal()">×</div>

        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <div class="slice">20000 KRW</div>
            <div class="slice">50000 KRW</div>
            <div class="slice">100000 KRW</div>
            <div class="slice">200000 KRW</div>
        </div>

        <button class="spin-btn" onclick="spin()">SPIN</button>
    </div>
</div>

<div class="win-popup" id="winPopup">
    🎉 Поздравляем! 🎉<br><br>
    Чтобы обналичить купон,<br>
    обратитесь к вашему<br>
    ❤️ самому любимому человеку ❤️
</div>

<script>
    let firstSpin = true;
    const wheel = document.getElementById("wheel");
    const modalBg = document.getElementById("modalBg");
    const winPopup = document.getElementById("winPopup");

    const prizes = ["20000 KRW","50000 KRW","100000 KRW","200000 KRW"];

    function openModal(){
        modalBg.style.display = "flex";
    }

    function closeModal(){
        modalBg.style.display = "none";
    }

    function spin(){
        let index;

        if(firstSpin){
            index = 3; // 200000 KRW
            firstSpin = false;
        } else {
            index = Math.floor(Math.random()*4);
        }

        const angle = 360*5 + (index*90) + 45;
        wheel.style.transform = `rotate(${angle}deg)`;

        setTimeout(()=> {
            if(prizes[index] === "200000 KRW"){
                showCelebration();
            }
        }, 4000);
    }

    function showCelebration(){
        winPopup.style.display = "block";
        for(let i=0; i<12; i++) firework();
        setTimeout(()=> winPopup.style.display="none", 3500);
    }

    function firework(){
        const fw = document.createElement("div");
        fw.classList.add("firework");
        fw.style.left = (Math.random()*window.innerWidth)+"px";
        fw.style.top = (Math.random()*window.innerHeight)+"px";
        document.body.appendChild(fw);
        setTimeout(()=> fw.remove(), 1000);
    }
</script>

</body>
</html>
